name: CI - Package

on:
  pull_request:
    branches: [main]
    paths:
      - "bin/**"
      - "package.json"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/ci-package.yml"

permissions:
  contents: read

jobs:
  npm-publish-dry-run:
    name: NPM Publish Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Show versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Assert CLI artifact exists
        run: test -f dist/create.js

      - name: Validate package.json normalisation
        run: npm pkg fix --dry-run

      - name: Check tarball contents
        run: npm pack --dry-run

      - name: Simulate publish
        run: npm publish --dry-run --access public

      - name: Check npm auth
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          npm ping

      - name: Skip npm auth check
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN not available in this PR context; skipping auth check"
