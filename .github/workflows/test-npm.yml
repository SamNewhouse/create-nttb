name: Test NPM

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.gitignore'
      - 'README.md'
      - 'LICENSE'
      - 'tsconfig.cli.json'
      - 'bin/**'
      - '.github/workflows/test-npm.yml'

permissions:
  contents: read

jobs:
  test-npm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build CLI artifact
        run: npm run build:cli

      - name: Assert CLI artifact exists
        run: test -f dist/create.js

      - name: Validate package.json normalization
        run: npm pkg fix --dry-run

      - name: Check tarball contents
        run: npm pack --dry-run

      - name: Simulate publish
        run: npm publish --dry-run --access public

      - name: Optional token auth check
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ping
