name: CI — CLI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "package.json"
      - ".github/workflows/ci-cli.yml"

permissions:
  contents: read

jobs:
  test:
    name: CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "24.x"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:cli

      - name: Build CLI
        run: npm run build:cli

      - name: Assert CLI artifact exists
        run: test -f dist/create.js

      - name: Link CLI globally
        run: npm link

      - name: Run CLI and verify output
        run: |
          npx create-nttb test-app || exit 1
          test -d test-app || { echo "test-app directory missing"; exit 1; }
          test -f test-app/package.json || { echo "package.json missing"; exit 1; }

      - name: Validate NPM scripts
        run: |
          for script in build start dev; do
            if ! grep -q "\"$script\"" "test-app/package.json"; then
              echo "NPM script '$script' missing"
              exit 1
            fi
          done

      - name: Cleanup
        run: rm -rf test-app

  npm-publish-dry-run:
    name: NPM Publish Dry Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Show versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Assert CLI artifact exists
        run: test -f dist/create.js

      - name: Validate package.json normalisation
        run: npm pkg fix --dry-run

      - name: Check tarball contents
        run: npm pack --dry-run

      - name: Simulate publish
        run: npm publish --dry-run --access public

      - name: Token auth check
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm ping
          else
            echo "NPM_TOKEN not set, skipping ping"
          fi
