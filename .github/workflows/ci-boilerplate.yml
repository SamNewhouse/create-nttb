name: CI — Boilerplate

on:
  pull_request:
    branches: [main]
    paths:
      - "template/**"
      - ".github/workflows/ci-boilerplate.yml"

permissions:
  contents: read

jobs:
  test:
    name: Boilerplate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "24.x"]

    defaults:
      run:
        working-directory: template

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build check
        run: npm run build
