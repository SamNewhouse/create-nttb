name: CI - CLI

on:
  pull_request:
    branches: [main]
    paths:
      - "bin/**"
      - "template/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "jest.config.js"
      - ".github/workflows/ci-cli.yml"

permissions:
  contents: read

jobs:
  test:
    name: CLI (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "24.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:cli

      - name: Build CLI
        run: npm run build:cli

      - name: Assert CLI artifacts exist
        run: |
          test -f dist/index.js
          test -f dist/install.js
          test -f dist/update.js
