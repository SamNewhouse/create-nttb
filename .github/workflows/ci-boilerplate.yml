name: CI - Boilerplate

on:
  pull_request:
    branches: [main]
    paths:
      - "template/**"
      - ".github/workflows/ci-boilerplate.yml"

permissions:
  contents: read

jobs:
  test:
    name: Boilerplate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20.x", "24.x"]
    defaults:
      run:
        working-directory: template

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build check
        run: npm run build
