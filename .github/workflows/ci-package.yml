name: CI — Package

on:
  pull_request:
    branches: [main]
    paths:
      - "bin/**"
      - "package.json"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/ci-package.yml"

permissions:
  contents: read

jobs:
  npm-publish-dry-run:
    name: NPM Publish Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Show versions
        run: node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Assert CLI artifact exists
        run: test -f dist/create.js

      - name: Validate package.json normalisation
        run: npm pkg fix --dry-run

      - name: Check tarball contents
        run: npm pack --dry-run

      - name: Simulate publish
        run: npm publish --dry-run --access public

      - name: Token auth check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm ping
          else
            echo "NPM_TOKEN not set, skipping ping"
          fi
